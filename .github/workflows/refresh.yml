name: Refresh Gold Terminal

# Runs every 15 minutes, Mon–Fri (UTC), plus manual trigger from the Actions tab.
# Fetches live quotes, re-validates the model, regenerates charts and data.json,
# commits to main → GitHub Pages republishes automatically.

on:
  schedule:
    - cron: '*/15 * * * 1-5'
    - cron: '5 8,13 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'market/exness_quote.json'
      - 'market/exness_h1.csv'
      - 'market/exness_m15.csv'
  workflow_dispatch:

permissions:
  contents: write        # needed to push the refreshed snapshot

concurrency:
  group: gold-terminal-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Exness four-hour research forecast
        run: python live_engine.py

      - name: Exness shadow forecast
        run: python exness_shadow.py

      - name: Run engine (fetch → model → charts → data.json)
        run: python update.py

      - name: Run intraday models and research audit
        run: python session_research.py

      - name: Commit refreshed snapshot (only if changed)
        run: |
          git config user.name  "gold-terminal[bot]"
          git config user.email "gold-terminal[bot]@users.noreply.github.com"
          git add docs/data.json docs/intraday.json docs/research.json docs/sessions.json docs/exness_shadow.json docs/exness_rolling.json docs/charts cache forecast_log.json quote_audit.json market/exness_shadow_log.json market/exness_rolling_log.json
          git add docs/four_hour_research.json
          if test -f market/four_hour_research_log.json; then git add market/four_hour_research_log.json; fi
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore: market-data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Never force-push: preserve remote uploader and forecast history.
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=true; break; fi
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Concurrent change conflict; leaving logs in the failure artifact."
                exit 1
              fi
            done
            if [ "$pushed" != true ]; then echo "Push failed; see failure artifact."; exit 1; fi
          fi

      - name: Preserve forecast logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-forecast-logs-${{ github.run_id }}
          path: |
            market/four_hour_research_log.json
            market/exness_shadow_log.json
            market/exness_rolling_log.json
          if-no-files-found: warn
          retention-days: 30

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
