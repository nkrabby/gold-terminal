name: Refresh Gold Terminal

on:
  schedule:
    - cron: '*/30 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-terminal-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update market data and model
        run: python update.py

      - name: Commit refreshed data
        run: |
          git config user.name "gold-terminal[bot]"
          git config user.email "gold-terminal[bot]@users.noreply.github.com"
          git add docs/data.json docs/charts cache
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh market data"
            git push
          fi
